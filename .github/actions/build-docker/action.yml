name: "Build docker image as the CI environment"
description: "Build docker image as the CI environment from a given dockerfile"

inputs:
  imageTag:
    description: "Tag to apply to the docker image"
    required: false
    default: "tapa/buildenv:local"
  dockerfile:
    description: "Path to the dockerfile to build"
    required: false
    default: "./.github/docker/build-env/Dockerfile.binary"
  context:
    description: "Path to the build context"
    required: false
    default: "./.github/docker/build-env"

runs:
  using: "composite"
  steps:
    - name: Create docker image as the build environment
      # Retry the build: package mirrors and GitHub occasionally drop a
      # connection mid-layer. Docker keeps the layers it already finished, so a
      # retry resumes at the failed one rather than starting over.
      run: |
        attempt=1
        max_attempts=3
        while true; do
          rc=0
          docker build \
            -t ${{ inputs.imageTag }} \
            -f ${{ inputs.dockerfile }} \
            --build-arg UBUNTU_PRO_TOKEN=${{ env.UBUNTU_PRO_TOKEN }} \
            --build-arg DOCKER_USER_ID=$(id -u) \
            --build-arg DOCKER_GROUP_ID=$(id -g) \
            ${{ inputs.context }} || rc=$?
          if [[ $rc -eq 0 || $attempt -ge $max_attempts ]]; then
            exit $rc
          fi
          echo "::warning::docker build failed (exit $rc); retrying in 30s (attempt $attempt/$max_attempts)"
          sleep 30
          attempt=$((attempt+1))
        done
      shell: bash
