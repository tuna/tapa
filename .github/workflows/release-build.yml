name: Release Build

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Name of the uploaded artifact containing the release tarball"
        required: false
        default: tapa
        type: string
      retention_days:
        description: "Number of days to retain the uploaded artifact"
        required: false
        default: 7
        type: number

jobs:
  build-release:
    name: Build Release
    runs-on: self-hosted

    steps:
      - name: Checkout myself
        uses: ./.github/actions/checkout-with-retry

      - name: Run Bazel to build
        uses: ./.github/actions/build-release
        env:
          UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
          MAC_ADDRESS: ${{ secrets.MAC_ADDRESS }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/artifacts.out/*.tar.gz
          retention-days: ${{ inputs.retention_days }}
