name: Staging

concurrency:
  group: release

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Staging
    uses: ./.github/workflows/release-build.yml
    secrets: inherit

  test-staging:
    name: Test Staging
    runs-on: self-hosted
    needs: build

    strategy:
      # One broken image must not cancel the other jobs: a single
      # distro-specific failure used to hide every other result in the matrix.
      fail-fast: false
      matrix:
        include:
          # Test all Vitis versions on Ubuntu 24.04 LTS (the oldest Vitis
          # releases predate newer LTS releases).
          - os: ubuntu-24
            xilinx_version: "2024.2"
          - os: ubuntu-24
            xilinx_version: "2024.1"
          - os: ubuntu-24
            xilinx_version: "2023.2"
          - os: ubuntu-24
            xilinx_version: "2023.1"
          - os: ubuntu-24
            xilinx_version: "2022.2"
          # Test all OS versions with the latest Vitis version. Of the EOL
          # releases, only the earliest supported one is kept per distro.
          - os: ubuntu-26
            xilinx_version: "2024.2"
          - os: ubuntu-22
            xilinx_version: "2024.2"
          - os: ubuntu-18
            xilinx_version: "2024.2"
          - os: debian-13
            xilinx_version: "2024.2"
          - os: debian-12
            xilinx_version: "2024.2"
          - os: debian-10
            xilinx_version: "2024.2"
          - os: almalinux-10
            xilinx_version: "2024.2"
          - os: almalinux-9
            xilinx_version: "2024.2"
          - os: rockylinux-10
            xilinx_version: "2024.2"
          - os: rockylinux-9
            xilinx_version: "2024.2"
          - os: fedora-44
            xilinx_version: "2024.2"
          - os: fedora-43
            xilinx_version: "2024.2"
          - os: fedora-34
            xilinx_version: "2024.2"
          - os: amazonlinux-2023
            xilinx_version: "2024.2"

    steps:
      - name: Checkout myself
        uses: ./.github/actions/checkout-with-retry

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tapa

      - name: Run tests with the downloaded artifact
        uses: ./.github/actions/run-command
        with:
          run: |
            TAPA_LOCAL_PACKAGE=/workspace/tapa.tar.gz ./install.sh -q
            export TAPA_HOME=~/.tapa
            export PATH=~/.tapa/usr/bin:$PATH
            export TAPA_CONCURRENCY=1
            source /opt/tools/xilinx/Vitis/${{ matrix.xilinx_version }}/settings64.sh
            find tests -name '*.bats' -print0 | xargs -0 bats -j $(nproc)
          imageTag: tapa/testenv:${{ matrix.os }}
          dockerfile: ./.github/docker/test-env/Dockerfile.${{ matrix.os }}
          context: ./.github/docker/test-env

  create-staging-release:
    name: Create Staging Release
    runs-on: self-hosted
    needs: test-staging
    if: "!github.event.act && startsWith(github.event.ref, 'refs/tags') && !startsWith(github.event.ref, 'refs/tags/v')"

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tapa

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ${{ github.workspace }}/tapa.tar.gz
          body: |
            This is a staging build for ${{ github.sha }}.
          commit: ${{ github.sha }}
          name: Staging Build ${{ github.sha }}
          generateReleaseNotes: true
          prerelease: true
