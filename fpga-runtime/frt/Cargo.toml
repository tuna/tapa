[package]
name = "frt"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

# `staticlib` so libfrt.a can be linked privately into libtapa; `rlib` for the
# crate's own unit tests. No `cdylib`: FRT has a single consumer (tapa-lib) and
# no public interface, so it is statically embedded rather than shipped as a
# separate shared object. The frt-dpi-* crates remain cdylibs (dlopened by the
# simulators) and are unaffected.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
frt-cosim = { workspace = true }
frt-shm = { workspace = true }
libc = { workspace = true }
opencl3 = { workspace = true }
quick-xml = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
zip = { workspace = true }
