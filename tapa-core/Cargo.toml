[workspace]
resolver = "2"
members = [
  "tapa-protocol",
  "tapa-task-graph",
  "tapa-graphir",
  "tapa-rtl",
  "tapa-topology",
  "tapa-slotting",
  "tapa-codegen",
  "tapa-floorplan",
  "tapa-lowering",
  "tapa-graphir-export",
  "tapa-xilinx",
  "tapa-cli",
]

[workspace.lints.clippy]
# Enable lint groups
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Allow: adding doc sections to every fallible/panicking fn is too verbose
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Allow: const fn changes API semantics and is overzealous
missing_const_for_fn = "allow"

# Allow: common Rust module naming pattern
module_name_repetitions = "allow"

# Allow: option_if_let_else often less readable than match
option_if_let_else = "allow"

# Allow: too many trivial getters to annotate
must_use_candidate = "allow"

# Allow: cognitive complexity thresholds are too low for serde impls
cognitive_complexity = "allow"

# Allow: significant_drop_tightening has false positives
significant_drop_tightening = "allow"

# Allow: iteration order over HashMap/HashSet is irrelevant in schema crates
iter_over_hash_type = "allow"

# ── Restriction lints (cherry-picked) ──
# Style consistency
semicolon_outside_block = "deny"
needless_raw_strings = "deny"
missing_assert_message = "deny"

# Prevent common mistakes
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
error_impl_error = "deny"
string_add = "deny"

# Prevent subtle bugs
assertions_on_result_states = "deny"
wildcard_enum_match_arm = "deny"

# Code quality
allow_attributes_without_reason = "deny"
redundant_type_annotations = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
base64 = "0.22"
backon = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
directories = "6"
env_logger = "0.11"
evalexpr = "12"
fs2 = "0.4"
flate2 = "1"
fs-err = "3"
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
minijinja = "2"
nix = { version = "0.29", features = ["process", "signal"] }
nom = "8"
path-slash = "0.2"
phf = { version = "0.11", features = ["macros"] }
quick-xml = { version = "0.36", features = ["serialize"] }
rayon = "1"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "1"
shellexpand = "3"
streaming-iterator = "0.1"
strum = { version = "0.27", features = ["derive"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-systemverilog = "0.3"
typed-builder = "0.21"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Internal crates
tapa-protocol = { path = "tapa-protocol" }
tapa-task-graph = { path = "tapa-task-graph" }
tapa-graphir = { path = "tapa-graphir" }
tapa-rtl = { path = "tapa-rtl" }
tapa-topology = { path = "tapa-topology" }
tapa-slotting = { path = "tapa-slotting" }
tapa-codegen = { path = "tapa-codegen" }
tapa-floorplan = { path = "tapa-floorplan" }
tapa-lowering = { path = "tapa-lowering" }
tapa-graphir-export = { path = "tapa-graphir-export" }
tapa-xilinx = { path = "tapa-xilinx" }
tapa-cli = { path = "tapa-cli" }
