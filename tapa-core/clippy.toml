# Proper nouns and domain acronyms that `clippy::doc_markdown` mistakes for
# unback-ticked code identifiers. They are product/tool names and hardware
# terms, not symbols, so back-ticking them would read wrong. `..` keeps
# clippy's built-in allowlist (OpenGL, TypeScript, …).
doc-valid-idents = [
    "AutoBridge",
    "NoC",
    "CPLEX",
    "PuLP",
    "Vitis",
    "Vivado",
    "Verilator",
    "..",
]

# RTL emission/validation pass bodies are inherently sequential; the
# largest (distributed-control route validation, ~240 lines) stays one
# auditable transaction instead of per-reason `too_many_lines` allows.
too-many-lines-threshold = 260
