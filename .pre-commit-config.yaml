exclude: .*\.patch

repos:
  ############################
  #  Built-in Common Checks  #
  ############################

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        # Golden snapshots must stay byte-equal with the live
        # toolchain output; Vitis `.rpt` files do not terminate with
        # a newline, so auto-appending one would turn every CI run
        # into fake drift.
        exclude: ^tapa-core/testdata/golden/
      - id: file-contents-sorter
        files: ^\.gitignore$
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: pretty-format-json
        args:
          - --autofix
          - --indent=4
        # Also the solver-model fingerprints: the gate byte-compares the
        # generator's serialization, so reformatting is fake drift.
        exclude: ^tapa-core/testdata/golden/|^tapa-core/testdata/floorplan-model-fingerprints\.json$
      - id: trailing-whitespace
        # Same rationale as end-of-file-fixer above.
        exclude: ^tapa-core/testdata/golden/

  #####################
  #  Auto Formatting  #
  #####################

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|h|hpp)$
        # c_api.h is cbindgen-generated; formatting it breaks the
        # freshness check against the generator's output.
        exclude: ^tapa-lib/tapa/host/frt/c_api\.h$

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.0
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: local
    hooks:
      - id: cargo-fmt-all
        name: cargo fmt (all manifests)
        entry: sh -c 'set -e; for manifest in tapa-core/Cargo.toml fpga-runtime/Cargo.toml tools/test-tools/Cargo.toml; do cargo fmt --manifest-path "${manifest}" --all --; done'
        language: system
        files: ^(?:tapa-core|fpga-runtime|tools/test-tools)/(?:.*\.rs|(?:.*/)?Cargo\.(?:toml|lock))$
        pass_filenames: false

      - id: cargo-clippy-all
        name: cargo clippy (all manifests)
        entry: sh -c 'set -e; for manifest in tapa-core/Cargo.toml fpga-runtime/Cargo.toml tools/test-tools/Cargo.toml; do cargo clippy --manifest-path "${manifest}" --all-targets --locked; done'
        language: system
        files: ^(?:tapa-core|fpga-runtime|tools/test-tools)/(?:.*\.rs|(?:.*/)?Cargo\.(?:toml|lock))$
        pass_filenames: false

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.1"
    hooks:
      - id: codespell
        types_or: [asciidoc, markdown, rst]

  ##################
  #  Link Checks  #
  ##################

  - repo: https://github.com/google/pre-commit-tool-hooks
    rev: v1.2.5
    hooks:
      - id: check-links
