exclude: .*\.patch

repos:
  ############################
  #  Built-in Common Checks  #
  ############################

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        # Golden snapshots must stay byte-equal with the live
        # toolchain output; Vitis `.rpt` files do not terminate with
        # a newline, so auto-appending one would turn every CI run
        # into fake drift.
        exclude: ^tapa-core/tests/golden/
      - id: file-contents-sorter
        files: ^\.gitignore$
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: pretty-format-json
        args:
          - --autofix
          - --indent=4
        exclude: ^tapa-core/tests/golden/
      - id: trailing-whitespace
        # Same rationale as end-of-file-fixer above.
        exclude: ^tapa-core/tests/golden/

  #####################
  #  Auto Formatting  #
  #####################

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|h|hpp)$

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.0
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (fpga-runtime)
        entry: cargo fmt --manifest-path fpga-runtime/Cargo.toml --all --
        language: system
        files: ^fpga-runtime/(?:.*\.rs|(?:.*/)?Cargo\.(?:toml|lock))$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (fpga-runtime)
        entry: cargo clippy --manifest-path fpga-runtime/Cargo.toml --all-targets --locked
        language: system
        files: ^fpga-runtime/(?:.*\.rs|(?:.*/)?Cargo\.(?:toml|lock))$
        pass_filenames: false

      - id: cargo-fmt-tapa-core
        name: cargo fmt (tapa-core)
        entry: cargo fmt --manifest-path tapa-core/Cargo.toml --all --
        language: system
        files: ^tapa-core/(?:.*\.rs|(?:.*/)?Cargo\.(?:toml|lock))$
        pass_filenames: false

      - id: cargo-clippy-tapa-core
        name: cargo clippy (tapa-core)
        entry: cargo clippy --manifest-path tapa-core/Cargo.toml --all-targets --locked
        language: system
        files: ^tapa-core/(?:.*\.rs|(?:.*/)?Cargo\.(?:toml|lock))$
        pass_filenames: false

      - id: cargo-fmt-test-tools
        name: cargo fmt (test-tools)
        entry: cargo fmt --manifest-path tools/test-tools/Cargo.toml --all --
        language: system
        files: ^tools/test-tools/(?:.*\.rs|(?:.*/)?Cargo\.(?:toml|lock))$
        pass_filenames: false

      - id: cargo-clippy-test-tools
        name: cargo clippy (test-tools)
        entry: cargo clippy --manifest-path tools/test-tools/Cargo.toml --all-targets --locked
        language: system
        files: ^tools/test-tools/(?:.*\.rs|(?:.*/)?Cargo\.(?:toml|lock))$
        pass_filenames: false

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.1"
    hooks:
      - id: codespell
        types_or: [asciidoc, markdown, rst]

  ##################
  #  Link Checks  #
  ##################

  - repo: https://github.com/google/pre-commit-tool-hooks
    rev: v1.2.5
    hooks:
      - id: check-links
